<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>港口泊位与航道调度</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 960px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; margin-bottom: .5rem; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
<main>
  <h1>港口泊位与航道调度</h1>
  <p>潮汐窗口 + 靠泊计划 + 拖轮/引航资源的可恢复进港排班演示。</p>
  <div class="row">
    <button id="plans">靠泊计划与排班</button>
    <button id="tide">潮汐窗口</button>
    <button id="resources">拖轮/引航资源</button>
    <button id="events">系统审计（待确认/冲突/恢复）</button>
    <button id="stats">状态统计</button>
  </div>
  <pre id="output">点击上方按钮读取排班状态。</pre>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo"};
async function show(path) {
  const response = await fetch(path, {headers});
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
document.getElementById("plans").onclick = () => show("/api/plans?limit=50");
document.getElementById("tide").onclick = () => show("/api/tide-windows");
document.getElementById("resources").onclick = () => show("/api/resources");
document.getElementById("events").onclick = () => show("/api/system-events");
document.getElementById("stats").onclick = () => show("/api/stats");
</script>
</body>
</html>
